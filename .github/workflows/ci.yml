name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  search:
    name: Search database, API and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:frontend
      - run: npm run test:search
      - run: npx playwright install --with-deps chromium
      - run: npm run test:search:ui

  # URL routing (docs/ROUTING.md): the generated hosting config and the route map cannot drift
  # from the registry, the backend authorizes every protected route's data (real server + real
  # Postgres via PGlite, seeded personas, no network), and the real app opens every URL in Chromium.
  routing:
    name: Routing - config, backend authorization, browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run routes:check
      - run: node scripts/assemble_public.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:routing

  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test stops after about a dozen suites (one of them calls process.exit(0)
      # when loaded), so the delivery circuit has its own gate that runs for real.
      - name: Delivery circuit tests
        run: npm run test:delivery

      - name: Run test suite
        run: npm test

  # Boots the real server (development mode — the production config validator
  # only blocks NODE_ENV=production, see server/config/env.js) and probes the
  # exact health path Railway uses (healthcheckPath: /api/v1/health). This
  # catches "server crashes on boot" regressions for free: no credentials are
  # needed because Redis falls back to memory and Supabase/Clerk clients are
  # lazily initialized only when their routes are called.
  production-config-smoke:
    name: Server boot + /api/v1/health smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boot server and probe health endpoint
        run: |
          set -euo pipefail
          NODE_ENV=development PORT=8080 node server/index.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if node -e "require('http').get('http://127.0.0.1:8080/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              echo "HEALTH_OK: /api/v1/health returned 200"
              exit 0
            fi
            sleep 1
          done

          echo "FAIL: server did not answer 200 on /api/v1/health within 30s" >&2
          exit 1
