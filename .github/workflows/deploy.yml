name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Route config is in sync with the route registry
        run: npm run routes:check

      - name: Delivery circuit tests
        run: npm run test:delivery

      - name: Run required validation gate
        run: npm test

  deploy:
    name: Deploy (Railway CLI)
    runs-on: ubuntu-latest
    needs: validate
    # A step's own env is not visible to its `if`, so the check lives here.
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ships the pushed commit with the official Railway CLI (`railway up`). It is a
      # plain shell step on purpose: GitHub resolves every `uses:` action before the
      # job starts, even a skipped one, and the action this used to name
      # (railwayapp/actions-push) does not exist, so the job failed on every run.
      #
      # Inert until the repository secrets below exist (Railway also deploys main
      # from its own git link, so nothing is lost meanwhile):
      #
      #   RAILWAY_TOKEN      (required) a PROJECT token
      #     Railway Dashboard -> Project -> Settings -> Tokens -> New Token
      #     then GitHub repo -> Settings -> Secrets and variables -> Actions
      #     -> New repository secret -> RAILWAY_TOKEN
      #
      #   RAILWAY_SERVICE_ID (required with the token; targets the LOUMOO service)
      #     Railway Dashboard -> Service -> Settings -> General -> Service ID
      - name: Note when the Railway token is not configured
        if: env.HAS_RAILWAY_TOKEN != 'true'
        run: echo "::notice::RAILWAY_TOKEN is not set; Railway deploys main from its git link, so this push step is skipped."

      - name: Deploy to Railway
        if: env.HAS_RAILWAY_TOKEN == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: npx --yes @railway/cli@5 up --ci --service "$RAILWAY_SERVICE_ID"
