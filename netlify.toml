# ─────────────────────────────────────────────────────────────────────────────
# LOUMOO — Netlify deployment configuration
#
# Frontend: the single-file app (Commerce App.dc.html) plus its Assets/src/_ds
#           are assembled into public/ and served as static files from the CDN.
#           NOTE: loumoo.store is currently served by Vercel (see vercel.json); this
#           file is kept consistent with it but is not the live host.
# API:      the Express server (server/index.js) is wrapped by serverless-http in
#           netlify/functions/api.js; /api/* is rewritten to that function so the
#           browser talks to the API on the same origin.
#
# Secrets (Supabase keys, JWT secret, etc.) are configured as site environment
# variables in Netlify — never in this file, never in git.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "node scripts/assemble_public.js"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner flags any env-var VALUE that appears in build output.
  # These keys are public-by-design client identifiers (anon JWT, publishable keys,
  # project URL/ref, analytics/DSN) that legitimately surface in client config — so
  # omit them. The genuinely secret values (service-role key, JWT secret, Clerk
  # secret, Resend/ElevenLabs) are NOT omitted, so the scanner still guards them.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_PROJECT_REF,CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,CLERK_APP_ID,POSTHOG_API_KEY,POSTHOG_HOST,SENTRY_DSN,APP_BASE_URL"

[functions]
  node_bundler = "esbuild"
  # dataLoader.js reads these datasets as text via process.cwd() (not require), so
  # esbuild does not trace them. Ship them alongside the bundle at their repo path.
  included_files = ["src/data/**"]

# API → serverless-wrapped Express. Must come before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Frontend routes. Generated from src/routing/routes.js (the single route registry) by
# scripts/sync_route_config.js; `node scripts/sync_route_config.js --check` runs in the
# test suite. There is deliberately NO "/* -> /index.html" catch-all: it served the HTML
# shell with a 200 for a missing script or image. An unregistered path that is not a file
# gets 404.html (the same app shell, with a real 404) and the app draws its not-found
# screen. See docs/ROUTING.md.
# BEGIN GENERATED ROUTES (scripts/sync_route_config.js - do not edit by hand)
# Legacy paths -> canonical routes (permanent).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

